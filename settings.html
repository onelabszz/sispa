<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SISPA — Pengaturan Koneksi</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body>
<div class="min-h-screen py-10 px-4">
  <div class="max-w-2xl mx-auto">

    <div class="flex items-center justify-between mb-6">
      <a href="./index.html" class="btn btn-ghost">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>Kembali</span>
      </a>
      <div id="adminBadge" class="hidden badge badge-warning">
        <i data-lucide="shield" class="w-3 h-3"></i>
        <span>Mode Admin</span>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center">
            <i data-lucide="settings" class="w-5 h-5"></i>
          </div>
          <div>
            <h1 class="font-semibold text-slate-900">Pengaturan Koneksi</h1>
            <p class="text-xs text-slate-500">Alamat backend Google Apps Script</p>
          </div>
        </div>
      </div>
      <div class="card-body space-y-5">

        <!-- Status -->
        <div id="statusBox" class="flex items-start gap-3 p-4 rounded-lg bg-slate-50 border border-slate-200">
          <span id="statusIcon" class="w-5 h-5 text-slate-400 flex-shrink-0">
            <i data-lucide="circle-help" class="w-5 h-5"></i>
          </span>
          <div class="flex-1 text-sm" id="statusText">Belum diperiksa.</div>
        </div>

        <!-- Form -->
        <form id="settingsForm" class="space-y-4">
          <div>
            <label class="label" for="apiUrlInput">URL Web App Google Apps Script</label>
            <input type="url" id="apiUrlInput" class="input text-mono text-sm"
                   placeholder="https://script.google.com/macros/s/.../exec" />
            <p class="text-xs text-slate-500 mt-2">
              Dapatkan dari <strong>Apps Script → Deploy → Manage deployments → Web app URL</strong>.
              Harus diakhiri <code class="text-mono">/exec</code>.
            </p>
          </div>

          <div id="warningBox" class="hidden flex items-start gap-2 p-3 rounded-lg bg-amber-50 border border-amber-200 text-sm text-amber-800">
            <i data-lucide="alert-triangle" class="w-4 h-4 mt-0.5 flex-shrink-0"></i>
            <span>Anda sedang menggunakan URL kustom. Data akan tersimpan di backend tersebut.</span>
          </div>

          <div class="flex flex-wrap gap-3 pt-2">
            <button type="button" id="testBtn" class="btn btn-secondary">
              <i data-lucide="plug-zap" class="w-4 h-4"></i>
              <span>Uji Koneksi</span>
            </button>
            <button type="submit" class="btn btn-primary">
              <i data-lucide="save" class="w-4 h-4"></i>
              <span>Simpan</span>
            </button>
            <button type="button" id="resetBtn" class="btn btn-ghost text-red-600 ml-auto">
              <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
              <span>Reset</span>
            </button>
          </div>
        </form>

        <div class="divider"></div>

        <div>
          <div class="label">URL Default</div>
          <code id="defaultUrl" class="block text-xs bg-slate-100 p-3 rounded-lg text-mono break-all text-slate-600"></code>
        </div>

      </div>
    </div>

    <p class="text-xs text-slate-400 text-center mt-6">
      SISPA v<span id="appVersion"></span> · <span id="basePath"></span>
    </p>
  </div>
</div>

<script src="./assets/js/config.js"></script>
<script src="./assets/js/api.js"></script>
<script src="./assets/js/auth.js"></script>
<script src="./assets/js/app.js"></script>
<script>
  lucide.createIcons();

  // Cek admin
  const user = sispaGetUser();
  if (user && user.role === 'Admin') {
    document.getElementById('adminBadge').classList.remove('hidden');
    lucide.createIcons();
  } else if (user && user.role !== 'Admin') {
    // Non-admin logged in: redirect
    alert('Halaman pengaturan hanya dapat diakses oleh Administrator.');
    window.location.href = sispaHomeUrl(user);
  }
  // Jika belum login → tetap boleh (mode darurat)

  document.getElementById('defaultUrl').textContent = SISPA_CONFIG.DEFAULT_API_URL;
  document.getElementById('appVersion').textContent = SISPA_CONFIG.APP_VERSION;
  document.getElementById('basePath').textContent = SISPA_BASE || '/';

  const input = document.getElementById('apiUrlInput');
  const statusBox = document.getElementById('statusBox');
  const statusText = document.getElementById('statusText');
  const warningBox = document.getElementById('warningBox');

  input.value = getApiUrl();
  updateWarning();

  function updateWarning() {
    warningBox.classList.toggle('hidden', !isApiUrlCustom());
    lucide.createIcons();
  }

  function setStatus(type, message) {
    const iconName = type === 'ok'    ? 'check-circle'
                   : type === 'error' ? 'alert-circle'
                   : type === 'loading' ? 'loader-2'
                   : 'circle-help';
    const color = type === 'ok'    ? 'text-green-600'
                : type === 'error' ? 'text-red-600'
                : 'text-slate-500';
    statusBox.className = 'flex items-start gap-3 p-4 rounded-lg border ' +
      (type === 'ok'    ? 'bg-green-50 border-green-200'
      : type === 'error' ? 'bg-red-50 border-red-200'
      : 'bg-slate-50 border-slate-200');
    statusBox.innerHTML = `
      <i data-lucide="${iconName}" class="w-5 h-5 flex-shrink-0 ${color} ${type === 'loading' ? 'animate-spin' : ''}"></i>
      <div class="flex-1 text-sm">${escapeHtml(message)}</div>`;
    lucide.createIcons();
  }

  document.getElementById('testBtn').addEventListener('click', async () => {
    const btn = document.getElementById('testBtn');
    const url = input.value.trim();
    if (!url) return setStatus('error', 'URL masih kosong.');

    btn.disabled = true;
    btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Menguji...</span>`;
    lucide.createIcons();
    setStatus('loading', 'Menghubungi server...');

    const result = await testApiConnection(url);

    btn.disabled = false;
    btn.innerHTML = `<i data-lucide="plug-zap" class="w-4 h-4"></i><span>Uji Koneksi</span>`;
    lucide.createIcons();

    if (result.ok) {
      const d = result.data.data || {};
      setStatus('ok', `Koneksi berhasil. Aplikasi: ${d.app || '-'} v${d.version || '-'} · Storage: ${d.storage || '-'}`);
    } else if (result.error) {
      setStatus('error', 'Gagal: ' + result.error);
    } else {
      setStatus('error', (result.data && result.data.message) || 'Respons tidak dikenal.');
    }
  });

  document.getElementById('settingsForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const url = input.value.trim();
    if (!url) return setStatus('error', 'URL tidak boleh kosong.');
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) {
      if (!confirm('URL tidak sesuai format umum GAS Web App. Tetap simpan?')) return;
    }
    setApiUrl(url);
    updateWarning();
    setStatus('ok', 'URL berhasil disimpan. Silakan uji koneksi.');
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (!confirm('Kembalikan ke URL default?')) return;
    resetApiUrl();
    input.value = getApiUrl();
    updateWarning();
    setStatus('ok', 'URL dikembalikan ke default.');
  });
</script>
</body>
</html>
