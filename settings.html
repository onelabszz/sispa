<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SISPA — Pengaturan Koneksi</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body class="bg-slate-100 min-h-screen p-4">
<div class="max-w-2xl mx-auto mt-10 bg-white rounded-2xl shadow-lg p-8">

  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Pengaturan Koneksi</h1>
      <p class="text-sm text-slate-500">Ubah alamat backend Google Apps Script.</p>
    </div>
    <a href="./index.html" class="text-sm text-indigo-600 hover:underline">← Kembali</a>
  </div>

  <div id="statusBox" class="mb-6 p-4 rounded-lg bg-slate-50 border border-slate-200">
    <div class="flex items-center gap-2 text-sm">
      <span id="statusDot" class="w-3 h-3 rounded-full bg-slate-400"></span>
      <span id="statusText" class="text-slate-600">Belum diperiksa</span>
    </div>
  </div>

  <form id="settingsForm" class="space-y-5">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">URL Web App Google Apps Script</label>
      <input type="url" id="apiUrlInput"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none font-mono text-sm"
             placeholder="https://script.google.com/macros/s/.../exec" />
      <p class="text-xs text-slate-500 mt-2">
        Dapatkan URL ini dari <strong>Apps Script → Deploy → Manage deployments → Web app URL</strong>.
      </p>
    </div>

    <div id="warningBox" class="hidden p-3 rounded-lg bg-amber-50 border border-amber-200 text-sm text-amber-800">
      ⚠️ Anda sedang menggunakan URL kustom. Data akan tersimpan di backend tersebut.
    </div>

    <div class="flex flex-wrap gap-3">
      <button type="button" id="testBtn"
              class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-lg font-medium transition">Uji Koneksi</button>
      <button type="submit"
              class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition">Simpan</button>
      <button type="button" id="resetBtn"
              class="px-4 py-2 bg-white hover:bg-slate-50 text-red-600 border border-red-200 rounded-lg font-medium transition">Reset ke Default</button>
    </div>
  </form>

  <div class="mt-8 pt-6 border-t border-slate-200">
    <h2 class="text-sm font-semibold text-slate-700 mb-2">URL Default</h2>
    <code id="defaultUrl" class="block text-xs bg-slate-100 p-3 rounded break-all text-slate-600"></code>
  </div>
  <div class="mt-6 text-xs text-slate-400">SISPA v<span id="appVersion"></span></div>
</div>

<script src="./assets/js/config.js"></script>
<script src="./assets/js/api.js"></script>
<script>
  const input = document.getElementById('apiUrlInput');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const warningBox = document.getElementById('warningBox');

  document.getElementById('defaultUrl').textContent = SISPA_CONFIG.DEFAULT_API_URL;
  document.getElementById('appVersion').textContent = SISPA_CONFIG.APP_VERSION;
  input.value = getApiUrl();
  updateWarning();

  function updateWarning() {
    warningBox.classList.toggle('hidden', !isApiUrlCustom());
  }
  function setStatus(ok, message) {
    statusDot.className = 'w-3 h-3 rounded-full ' + (ok === null ? 'bg-slate-400' : ok ? 'bg-green-500' : 'bg-red-500');
    statusText.textContent = message;
    statusText.className = 'text-sm ' + (ok === null ? 'text-slate-600' : ok ? 'text-green-700' : 'text-red-700');
  }

  document.getElementById('testBtn').addEventListener('click', async () => {
    const btn = document.getElementById('testBtn');
    const url = input.value.trim();
    if (!url) return setStatus(false, 'URL masih kosong.');
    btn.disabled = true; btn.textContent = 'Menguji...';
    setStatus(null, 'Menghubungi server...');
    const result = await testApiConnection(url);
    btn.disabled = false; btn.textContent = 'Uji Koneksi';
    if (result.ok) setStatus(true, '✅ Koneksi berhasil. Backend merespons.');
    else if (result.error) setStatus(false, '❌ Gagal: ' + result.error);
    else setStatus(false, '⚠️ ' + (result.data && result.data.message || 'Respons tidak dikenal.'));
  });

  document.getElementById('settingsForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const url = input.value.trim();
    if (!url) return setStatus(false, 'URL tidak boleh kosong.');
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) {
      if (!confirm('URL tidak sesuai format umum GAS Web App. Tetap simpan?')) return;
    }
    setApiUrl(url); updateWarning();
    setStatus(true, '✅ URL disimpan. Silakan uji koneksi.');
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (!confirm('Kembalikan ke URL default?')) return;
    resetApiUrl(); input.value = getApiUrl(); updateWarning();
    setStatus(null, 'URL dikembalikan ke default.');
  });
</script>
</body>
</html>
