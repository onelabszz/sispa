<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SISPA — Coaching</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>

<!-- ================== KONTEN ================== -->

<div class="mb-6">
  <h1 class="text-2xl font-bold text-slate-900">Coaching</h1>
  <p class="text-sm text-slate-500 mt-1">Pilih guru untuk memulai atau melanjutkan sesi coaching (STAR–GROW).</p>
</div>

<!-- Filter -->
<div class="card mb-4">
  <div class="card-body flex flex-wrap gap-3 items-center">
    <div class="relative flex-1 min-w-[240px]">
      <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
        <i data-lucide="search" class="w-4 h-4"></i>
      </span>
      <input type="text" id="searchInput" placeholder="Cari nama guru..." class="input" style="padding-left: 2.4rem" />
    </div>
    <select id="filterStatus" class="select" style="max-width: 200px">
      <option value="">Semua Status</option>
      <option value="belum">Belum Dicoaching</option>
      <option value="draft">Draft</option>
      <option value="terkirim">Terkirim</option>
    </select>
  </div>
</div>

<div id="guruGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

<div id="emptyState" class="hidden card empty-state">
  <div class="empty-state-icon"><i data-lucide="users" class="w-6 h-6"></i></div>
  <h3 class="font-semibold text-slate-900 mb-1">Tidak ada guru</h3>
  <p class="text-sm text-slate-500">Tambahkan data guru terlebih dahulu.</p>
</div>

<!-- ================== END ================== -->

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  const user = sispaRequireLogin(['KS', 'Admin']);
  if (user) { mountShell('coaching'); loadData(); }

  let guruList = [];
  let coachingByGuru = {};
  let filterText = '';
  let filterStatus = '';

  async function loadData() {
    await withLoading('Memuat data coaching...', async () => {
      try {
        const [guru, cch] = await Promise.all([
          sispaRequest('guru.list', {}),
          sispaRequest('coaching.list', {})
        ]);
        guruList = guru;
        coachingByGuru = {};
        (cch.items || []).forEach(c => {
          if (!coachingByGuru[c.guru_id]) coachingByGuru[c.guru_id] = [];
          coachingByGuru[c.guru_id].push(c);
        });
        render();
      } catch (err) { handleApiError(err); }
    });
  }

  function getLatestForGuru(guruId) {
    const list = coachingByGuru[guruId] || [];
    if (!list.length) return null;
    const draft = list.filter(c => c.status === 'draft')
      .sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));
    if (draft.length) return draft[0];
    return list.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal))[0];
  }

  function render() {
    const grid = el('guruGrid');
    const empty = el('emptyState');

    const filtered = guruList.filter(g => {
      const matchText = !filterText || (g.nama || '').toLowerCase().includes(filterText.toLowerCase());
      if (!matchText) return false;
      if (!filterStatus) return true;
      const latest = getLatestForGuru(g.id);
      const status = latest ? latest.status : 'belum';
      return status === filterStatus;
    });

    if (!filtered.length) {
      grid.innerHTML = '';
      empty.classList.remove('hidden');
      refreshIcons();
      return;
    }
    empty.classList.add('hidden');

    grid.innerHTML = filtered.map(g => {
      const latest = getLatestForGuru(g.id);
      const statusKey = latest ? latest.status : 'belum';
      const statusLabel = statusKey === 'belum' ? 'Belum Dicoaching'
                        : statusKey === 'draft' ? 'Draft'
                        : 'Terkirim';
      const statusCls = statusKey === 'belum' ? 'badge-neutral'
                      : statusKey === 'draft' ? 'badge-warning'
                      : 'badge-success';

      let aksiHtml = '';
      if (!latest) {
        aksiHtml = `<a href="./coaching-form.html?guru=${g.id}" class="btn btn-primary w-full justify-center">
          ${icon('play-circle', 'w-4 h-4')}<span>Mulai Coaching</span></a>`;
      } else if (latest.status === 'draft') {
        aksiHtml = `<a href="./coaching-form.html?id=${latest.id}" class="btn btn-primary w-full justify-center">
          ${icon('pencil', 'w-4 h-4')}<span>Lanjutkan</span></a>
          <a href="./coaching-form.html?id=${latest.id}" class="btn btn-secondary w-full justify-center mt-2">
            ${icon('eye', 'w-4 h-4')}<span>Lihat Detail</span></a>`;
      } else {
        aksiHtml = `<a href="./coaching-form.html?id=${latest.id}" class="btn btn-secondary w-full justify-center">
          ${icon('eye', 'w-4 h-4')}<span>Lihat Coaching</span></a>
          <a href="./coaching-form.html?guru=${g.id}" class="btn btn-ghost w-full justify-center mt-2">
            ${icon('plus', 'w-4 h-4')}<span>Coaching Baru</span></a>`;
      }

      return `
        <div class="card card-body flex flex-col gap-3">
          <div class="flex items-start justify-between gap-2">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-10 h-10 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center font-semibold flex-shrink-0">
                ${escapeHtml((g.nama || 'U').charAt(0).toUpperCase())}
              </div>
              <div class="min-w-0">
                <div class="font-semibold text-slate-900 truncate">${escapeHtml(g.nama)}</div>
                <div class="text-xs text-slate-500 truncate">${escapeHtml(g.mapel || '—')} · ${escapeHtml(g.kelas || '—')}</div>
              </div>
            </div>
            <span class="badge ${statusCls} flex-shrink-0">${statusLabel}</span>
          </div>
          ${latest ? `
            <div class="flex items-center justify-between text-xs border-t border-slate-100 pt-2">
              <span class="text-slate-500">${formatTanggal(latest.tanggal)}</span>
              <span class="text-mono font-semibold text-purple-600">${latest.skor_total}/32</span>
            </div>` : `
            <div class="text-xs text-slate-400 border-t border-slate-100 pt-2 text-center">
              Belum ada coaching
            </div>`}
          <div class="mt-auto">${aksiHtml}</div>
        </div>`;
    }).join('');

    refreshIcons();
  }

  el('searchInput').addEventListener('input', (e) => { filterText = e.target.value; render(); });
  el('filterStatus').addEventListener('change', (e) => { filterStatus = e.target.value; render(); });
</script>
</body>
</html>
