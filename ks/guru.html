<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SISPA — Data Guru</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body class="bg-slate-100 min-h-screen">
<div id="appHeader"></div>

<main class="max-w-6xl mx-auto px-4 py-8">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Data Guru</h1>
      <p id="sekolahInfo" class="text-sm text-slate-500"></p>
    </div>
    <button id="btnAdd" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition">+ Tambah Guru</button>
  </div>

  <div class="bg-white rounded-xl shadow-sm overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 text-slate-600 text-left">
        <tr>
          <th class="px-4 py-3">NIP</th>
          <th class="px-4 py-3">Nama</th>
          <th class="px-4 py-3">Mapel</th>
          <th class="px-4 py-3">Kelas</th>
          <th class="px-4 py-3 text-right">Aksi</th>
        </tr>
      </thead>
      <tbody id="guruTable" class="divide-y divide-slate-100"></tbody>
    </table>
    <div id="emptyState" class="hidden p-8 text-center text-slate-500">Belum ada data guru.</div>
  </div>
</main>

<!-- Modal Form -->
<div id="modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6">
    <h2 id="modalTitle" class="text-lg font-bold text-slate-800 mb-4">Tambah Guru</h2>
    <form id="guruForm" class="space-y-3">
      <input type="hidden" id="fId" />
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">NIP</label>
        <input type="text" id="fNip" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nama <span class="text-red-500">*</span></label>
        <input type="text" id="fNama" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Mapel</label>
          <input type="text" id="fMapel" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Kelas</label>
          <input type="text" id="fKelas" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input type="email" id="fEmail" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" id="btnCancel" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded-lg font-medium">Batal</button>
        <button type="submit" id="btnSave" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium">Simpan</button>
      </div>
    </form>
  </div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  const user = sispaRequireLogin(['KS']);
  if (user) {
    mountHeader('/ks/guru.html');
    el('sekolahInfo').textContent = user.nama_sekolah + ' · NPSN ' + user.npsn;
    loadGuru();
  }

  let guruList = [];

  async function loadGuru() {
    try {
      guruList = await sispaRequest('guru.list', {});
      renderTable();
    } catch (err) { handleApiError(err); }
  }

  function renderTable() {
    const tbody = el('guruTable');
    const empty = el('emptyState');
    if (!guruList.length) {
      tbody.innerHTML = '';
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');
    tbody.innerHTML = guruList.map(g => `
      <tr class="hover:bg-slate-50">
        <td class="px-4 py-3 font-mono text-xs">${escapeHtml(g.nip)}</td>
        <td class="px-4 py-3 font-medium text-slate-800">${escapeHtml(g.nama)}</td>
        <td class="px-4 py-3">${escapeHtml(g.mapel)}</td>
        <td class="px-4 py-3">${escapeHtml(g.kelas)}</td>
        <td class="px-4 py-3 text-right">
          <button data-edit="${g.id}" class="text-indigo-600 hover:underline text-xs mr-3">Edit</button>
          <button data-del="${g.id}" class="text-red-600 hover:underline text-xs">Hapus</button>
        </td>
      </tr>`).join('');

    tbody.querySelectorAll('[data-edit]').forEach(b =>
      b.addEventListener('click', () => openEdit(b.dataset.edit)));
    tbody.querySelectorAll('[data-del]').forEach(b =>
      b.addEventListener('click', () => doDelete(b.dataset.del)));
  }

  function openModal(title) {
    el('modalTitle').textContent = title;
    el('modal').classList.remove('hidden');
  }
  function closeModal() {
    el('modal').classList.add('hidden');
    el('guruForm').reset();
    el('fId').value = '';
  }

  el('btnAdd').addEventListener('click', () => {
    closeModal(); openModal('Tambah Guru');
  });
  el('btnCancel').addEventListener('click', closeModal);

  function openEdit(id) {
    const g = guruList.find(x => x.id === id);
    if (!g) return;
    el('fId').value = g.id;
    el('fNip').value = g.nip;
    el('fNama').value = g.nama;
    el('fMapel').value = g.mapel;
    el('fKelas').value = g.kelas;
    el('fEmail').value = g.email;
    openModal('Edit Guru');
  }

  el('guruForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = el('btnSave');
    btn.disabled = true; btn.textContent = 'Menyimpan...';
    const id = el('fId').value;
    const payload = {
      nip: el('fNip').value.trim(),
      nama: el('fNama').value.trim(),
      mapel: el('fMapel').value.trim(),
      kelas: el('fKelas').value.trim(),
      email: el('fEmail').value.trim()
    };
    try {
      if (id) {
        await sispaRequest('guru.update', { id, payload });
        showToast('Guru diperbarui', 'success');
      } else {
        await sispaRequest('guru.create', payload);
        showToast('Guru ditambahkan', 'success');
      }
      closeModal();
      await loadGuru();
    } catch (err) { handleApiError(err); }
    finally { btn.disabled = false; btn.textContent = 'Simpan'; }
  });

  async function doDelete(id) {
    const g = guruList.find(x => x.id === id);
    if (!g) return;
    if (!confirm('Hapus guru "' + g.nama + '"? Tindakan ini tidak dapat dibatalkan.')) return;
    try {
      await sispaRequest('guru.delete', { id });
      showToast('Guru dihapus', 'success');
      await loadGuru();
    } catch (err) { handleApiError(err); }
  }
</script>
</body>
</html>
