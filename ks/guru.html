<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SISPA — Data Guru</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>

<div class="flex items-center justify-between mb-6 gap-4">
  <div>
    <h1 class="text-2xl font-bold text-slate-900">Data Guru</h1>
    <p class="text-sm text-slate-500 mt-1" id="sekolahInfo">Memuat...</p>
  </div>
  <button id="btnAdd" class="btn btn-primary">
    <i data-lucide="plus" class="w-4 h-4"></i>
    <span>Tambah Guru</span>
  </button>
</div>

<div class="card overflow-hidden">
  <div class="overflow-x-auto">
    <table class="table">
      <thead>
        <tr>
          <th>NIP</th>
          <th>Nama</th>
          <th>Mapel</th>
          <th>Kelas</th>
          <th class="text-right">Aksi</th>
        </tr>
      </thead>
      <tbody id="guruTable"></tbody>
    </table>
  </div>
  <div id="emptyState" class="hidden empty-state">
    <div class="empty-state-icon"><i data-lucide="users" class="w-6 h-6"></i></div>
    <h3 class="font-semibold text-slate-900 mb-1">Belum ada data guru</h3>
    <p class="text-sm text-slate-500 mb-4">Mulai dengan menambahkan guru pertama.</p>
    <button onclick="el('btnAdd').click()" class="btn btn-primary">
      <i data-lucide="plus" class="w-4 h-4"></i>
      <span>Tambah Guru</span>
    </button>
  </div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  const user = sispaRequireLogin(['KS', 'Admin']);
  if (user) {
    mountShell('guru');
    el('sekolahInfo').textContent = user.nama_sekolah + ' · NPSN ' + user.npsn;
    loadGuru();
  }

  let guruList = [];

  async function loadGuru() {
    await withLoading('Memuat data guru...', async () => {
      try {
        guruList = await sispaRequest('guru.list', {});
        renderTable();
      } catch (err) { handleApiError(err); }
    });
  }

  function renderTable() {
    const tbody = el('guruTable');
    const empty = el('emptyState');
    const table = tbody.closest('.card').querySelector('.overflow-x-auto');

    if (!guruList.length) {
      table.classList.add('hidden');
      empty.classList.remove('hidden');
      refreshIcons();
      return;
    }
    table.classList.remove('hidden');
    empty.classList.add('hidden');

    tbody.innerHTML = guruList.map(g => `
      <tr>
        <td class="text-mono text-xs">${escapeHtml(g.nip || '—')}</td>
        <td class="font-medium text-slate-900">${escapeHtml(g.nama)}</td>
        <td>${escapeHtml(g.mapel || '—')}</td>
        <td>${escapeHtml(g.kelas || '—')}</td>
        <td class="text-right">
          <button class="icon-btn" data-edit="${g.id}" title="Edit">
            <i data-lucide="pencil" class="w-4 h-4"></i>
          </button>
          <button class="icon-btn text-red-600" data-del="${g.id}" title="Hapus">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </td>
      </tr>`).join('');

    tbody.querySelectorAll('[data-edit]').forEach(b =>
      b.addEventListener('click', () => openEdit(b.dataset.edit)));
    tbody.querySelectorAll('[data-del]').forEach(b =>
      b.addEventListener('click', () => doDelete(b.dataset.del)));
    refreshIcons();
  }

  el('btnAdd').addEventListener('click', () => openForm());

  function openForm(g) {
    const isEdit = !!g;
    openModal({
      title: isEdit ? 'Edit Data Guru' : 'Tambah Guru',
      body: `
        <form id="guruForm" class="space-y-4">
          <input type="hidden" id="fId" value="${isEdit ? escapeHtml(g.id) : ''}" />
          <div>
            <label class="label" for="fNip">NIP</label>
            <input type="text" id="fNip" class="input" value="${isEdit ? escapeHtml(g.nip || '') : ''}" />
          </div>
          <div>
            <label class="label" for="fNama">Nama Lengkap <span class="text-red-500">*</span></label>
            <input type="text" id="fNama" required class="input" value="${isEdit ? escapeHtml(g.nama || '') : ''}" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="label" for="fMapel">Mata Pelajaran</label>
              <input type="text" id="fMapel" class="input" value="${isEdit ? escapeHtml(g.mapel || '') : ''}" />
            </div>
            <div>
              <label class="label" for="fKelas">Kelas</label>
              <input type="text" id="fKelas" class="input" value="${isEdit ? escapeHtml(g.kelas || '') : ''}" />
            </div>
          </div>
          <div>
            <label class="label" for="fEmail">Email</label>
            <input type="email" id="fEmail" class="input" value="${isEdit ? escapeHtml(g.email || '') : ''}" />
          </div>
        </form>`,
      footer: `
        <button class="btn btn-secondary" data-close>Batal</button>
        <button class="btn btn-primary" id="btnSave">
          <i data-lucide="save" class="w-4 h-4"></i>
          <span>Simpan</span>
        </button>`,
    });
    el('btnSave').addEventListener('click', saveGuru);
  }

  function openEdit(id) {
    const g = guruList.find(x => x.id === id);
    if (g) openForm(g);
  }

  async function saveGuru() {
    const btn = el('btnSave');
    btn.disabled = true;
    btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Menyimpan...</span>`;
    refreshIcons();

    const id = el('fId').value;
    const payload = {
      nip: el('fNip').value.trim(),
      nama: el('fNama').value.trim(),
      mapel: el('fMapel').value.trim(),
      kelas: el('fKelas').value.trim(),
      email: el('fEmail').value.trim()
    };

    if (!payload.nama) {
      showToast('Nama guru wajib diisi', 'error');
      btn.disabled = false;
      btn.innerHTML = `<i data-lucide="save" class="w-4 h-4"></i><span>Simpan</span>`;
      refreshIcons();
      return;
    }

    try {
      if (id) {
        await sispaRequest('guru.update', { id, payload });
        showToast('Data guru diperbarui', 'success');
      } else {
        await sispaRequest('guru.create', payload);
        showToast('Guru ditambahkan', 'success');
      }
      closeModal();
      clearFrontendCache && clearFrontendCache();
      await loadGuru();
    } catch (err) {
      handleApiError(err);
      btn.disabled = false;
      btn.innerHTML = `<i data-lucide="save" class="w-4 h-4"></i><span>Simpan</span>`;
      refreshIcons();
    }
  }

  async function doDelete(id) {
    const g = guruList.find(x => x.id === id);
    if (!g) return;
    if (!confirm(`Hapus guru "${g.nama}"?`)) return;
    await withLoading('Menghapus...', async () => {
      try {
        await sispaRequest('guru.delete', { id });
        showToast('Guru dihapus', 'success');
        clearFrontendCache && clearFrontendCache();
        await loadGuru();
      } catch (err) { handleApiError(err); }
    });
  }
</script>
</body>
</html>
