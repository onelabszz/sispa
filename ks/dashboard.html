<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SISPA — Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>

<!-- KONTEN HALAMAN -->
<div class="mb-6">
  <h1 class="text-2xl font-bold text-slate-900">Dashboard</h1>
  <p class="text-sm text-slate-500 mt-1">Ringkasan aktivitas supervisi di sekolah Anda.</p>
</div>

<div id="statsGrid" class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
  <div class="stat-card">
    <div class="stat-icon bg-blue-50 text-blue-600"><i data-lucide="users" class="w-5 h-5"></i></div>
    <div>
      <div class="text-xs text-slate-500">Total Guru</div>
      <div id="statGuru" class="text-2xl font-bold text-slate-900">—</div>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon bg-indigo-50 text-indigo-600"><i data-lucide="clipboard-list" class="w-5 h-5"></i></div>
    <div>
      <div class="text-xs text-slate-500">Supervisi</div>
      <div id="statSupervisi" class="text-2xl font-bold text-slate-900">—</div>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon bg-purple-50 text-purple-600"><i data-lucide="message-square" class="w-5 h-5"></i></div>
    <div>
      <div class="text-xs text-slate-500">Coaching</div>
      <div id="statCoaching" class="text-2xl font-bold text-slate-900">—</div>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon bg-emerald-50 text-emerald-600"><i data-lucide="trending-up" class="w-5 h-5"></i></div>
    <div>
      <div class="text-xs text-slate-500">Rata Skor</div>
      <div id="statSkor" class="text-2xl font-bold text-slate-900">—</div>
    </div>
  </div>
</div>

<h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wide mb-3">Aksi Cepat</h2>
<div class="grid md:grid-cols-3 gap-4 mb-8">
  <a href="./guru.html" class="card card-body hover:shadow-md transition group">
    <div class="flex items-start gap-3">
      <div class="w-10 h-10 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center flex-shrink-0 group-hover:bg-blue-100 transition">
        <i data-lucide="users" class="w-5 h-5"></i>
      </div>
      <div class="flex-1">
        <div class="font-semibold text-slate-900 text-sm">Kelola Guru</div>
        <div class="text-xs text-slate-500 mt-0.5">Tambah, edit, atau hapus data guru</div>
      </div>
      <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400 group-hover:translate-x-1 transition"></i>
    </div>
  </a>
  <a href="./supervisi.html" class="card card-body hover:shadow-md transition group">
    <div class="flex items-start gap-3">
      <div class="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center flex-shrink-0 group-hover:bg-indigo-100 transition">
        <i data-lucide="clipboard-list" class="w-5 h-5"></i>
      </div>
      <div class="flex-1">
        <div class="font-semibold text-slate-900 text-sm">Supervisi Akademik</div>
        <div class="text-xs text-slate-500 mt-0.5">Isi instrumen LK1</div>
      </div>
      <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400 group-hover:translate-x-1 transition"></i>
    </div>
  </a>
  <a href="./coaching.html" class="card card-body hover:shadow-md transition group">
    <div class="flex items-start gap-3">
      <div class="w-10 h-10 rounded-lg bg-purple-50 text-purple-600 flex items-center justify-center flex-shrink-0 group-hover:bg-purple-100 transition">
        <i data-lucide="message-square" class="w-5 h-5"></i>
      </div>
      <div class="flex-1">
        <div class="font-semibold text-slate-900 text-sm">Coaching</div>
        <div class="text-xs text-slate-500 mt-0.5">Isi instrumen LK2 (STAR-GROW)</div>
      </div>
      <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400 group-hover:translate-x-1 transition"></i>
    </div>
  </a>
</div>

<div class="card">
  <div class="card-header">
    <div class="flex items-center gap-2">
      <i data-lucide="clock" class="w-4 h-4 text-slate-500"></i>
      <h2 class="font-semibold text-slate-900 text-sm">Aktivitas Terakhir</h2>
    </div>
  </div>
  <div id="aktivitasList" class="card-body text-sm text-slate-500">Memuat...</div>
</div>
<!-- END KONTEN -->

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  const user = sispaRequireLogin(['KS', 'Admin']);
  if (user) {
    mountShell('dashboard');
    loadDashboard();
  }

  async function loadDashboard() {
    try {
      const data = await sispaRequest('dashboard.ks', {});
      el('statGuru').textContent = data.jumlah_guru;
      el('statSupervisi').textContent = data.jumlah_supervisi;
      el('statCoaching').textContent = data.jumlah_coaching;
      el('statSkor').textContent = data.rata_skor_supervisi || '0';

      const list = el('aktivitasList');
      if (!data.aktivitas_terakhir || data.aktivitas_terakhir.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon"><i data-lucide="inbox" class="w-6 h-6"></i></div>
            <div class="text-sm text-slate-500">Belum ada aktivitas supervisi.</div>
          </div>`;
      } else {
        list.innerHTML = data.aktivitas_terakhir.map((a, i) => `
          <div class="flex items-center justify-between py-3 ${i < data.aktivitas_terakhir.length - 1 ? 'border-b border-slate-100' : ''}">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-lg bg-slate-100 text-slate-600 flex items-center justify-center">
                <i data-lucide="file-text" class="w-4 h-4"></i>
              </div>
              <div>
                <div class="text-sm font-medium text-slate-900">${escapeHtml(a.guru_id)}</div>
                <div class="text-xs text-slate-500">${formatTanggal(a.tanggal)}</div>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <span class="badge ${a.status === 'terkirim' ? 'badge-success' : 'badge-neutral'}">
                ${escapeHtml(a.status)}
              </span>
              <span class="text-mono text-sm font-medium text-slate-700">${a.skor_total}</span>
            </div>
          </div>`).join('');
      }
      refreshIcons();
    } catch (err) { handleApiError(err); }
  }
</script>
</body>
</html>
