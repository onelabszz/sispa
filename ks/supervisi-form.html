<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SISPA — Form Supervisi LK1</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>

<div class="flex items-center justify-between mb-6 gap-4">
  <div>
    <h1 id="pageTitle" class="text-2xl font-bold text-slate-900">Supervisi Baru</h1>
    <p class="text-sm text-slate-500 mt-1">Instrumen LK1 · 19 indikator</p>
  </div>
  <a href="./supervisi.html" class="btn btn-ghost">
    <i data-lucide="arrow-left" class="w-4 h-4"></i>
    <span>Kembali</span>
  </a>
</div>

<!-- Identitas -->
<div class="card mb-6">
  <div class="card-header">
    <div class="flex items-center gap-2">
      <i data-lucide="info" class="w-4 h-4 text-slate-500"></i>
      <h2 class="font-semibold text-slate-900 text-sm">Identitas Supervisi</h2>
    </div>
  </div>
  <div class="card-body grid md:grid-cols-2 gap-4">
    <div>
      <label class="label" for="fGuru">Guru <span class="text-red-500">*</span></label>
      <select id="fGuru" required class="select">
        <option value="">— Pilih Guru —</option>
      </select>
    </div>
    <div>
      <label class="label" for="fTanggal">Tanggal <span class="text-red-500">*</span></label>
      <input type="date" id="fTanggal" required class="input" />
    </div>
    <div>
      <label class="label" for="fMapel">Mata Pelajaran</label>
      <input type="text" id="fMapel" class="input" />
    </div>
    <div>
      <label class="label" for="fMateri">Materi</label>
      <input type="text" id="fMateri" class="input" />
    </div>
    <div>
      <label class="label" for="fDurasi">Durasi (menit)</label>
      <input type="number" id="fDurasi" min="1" class="input" />
    </div>
    <div>
      <label class="label" for="fLink">Link Dokumentasi</label>
      <div class="relative">
        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
          <i data-lucide="link" class="w-4 h-4"></i>
        </span>
        <input type="url" id="fLink" placeholder="https://drive.google.com/..." class="input" style="padding-left: 2.4rem" />
      </div>
    </div>
  </div>
</div>

<!-- Instrumen -->
<div class="card mb-6">
  <div class="card-header sticky top-16 z-20 bg-white rounded-t-2xl">
    <div class="flex items-center gap-2">
      <i data-lucide="list-checks" class="w-4 h-4 text-slate-500"></i>
      <h2 class="font-semibold text-slate-900 text-sm">Instrumen Penilaian</h2>
    </div>
    <div class="flex items-center gap-3 text-sm">
      <span class="text-slate-500">Skor:</span>
      <span id="totalSkor" class="text-mono font-bold text-indigo-600 text-lg">0</span>
      <span class="text-slate-400">/76</span>
      <span id="kategori" class="badge badge-neutral">—</span>
    </div>
  </div>
  <div class="card-body">
    <div id="instrumenContainer" class="space-y-6"></div>
  </div>
</div>

<!-- Catatan Kualitatif -->
<div class="card mb-6">
  <div class="card-header">
    <div class="flex items-center gap-2">
      <i data-lucide="file-edit" class="w-4 h-4 text-slate-500"></i>
      <h2 class="font-semibold text-slate-900 text-sm">Catatan Kualitatif</h2>
    </div>
  </div>
  <div class="card-body space-y-4">
    <div>
      <label class="label" for="fCatatan">Catatan Tambahan</label>
      <textarea id="fCatatan" rows="2" class="textarea"></textarea>
    </div>
    <div>
      <label class="label" for="fKekuatan">Kekuatan / Praktik Baik</label>
      <textarea id="fKekuatan" rows="2" class="textarea"></textarea>
    </div>
    <div>
      <label class="label" for="fArea">Area yang Perlu Dikembangkan</label>
      <textarea id="fArea" rows="2" class="textarea"></textarea>
    </div>
    <div>
      <label class="label" for="fRencana">Rencana Pembinaan Tindak Lanjut</label>
      <textarea id="fRencana" rows="2" class="textarea"></textarea>
    </div>
  </div>
</div>

<!-- Actions -->
<div class="flex flex-wrap justify-between gap-3 mb-10">
  <a href="./supervisi.html" class="btn btn-ghost">
    <i data-lucide="x" class="w-4 h-4"></i>
    <span>Batal</span>
  </a>
  <div class="flex flex-wrap gap-3">
    <button id="btnSave" class="btn btn-secondary">
      <i data-lucide="save" class="w-4 h-4"></i>
      <span>Simpan Draft</span>
    </button>
    <button id="btnSubmit" class="btn btn-primary">
      <i data-lucide="send" class="w-4 h-4"></i>
      <span>Simpan &amp; Kirim</span>
    </button>
  </div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/instruments.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  const user = sispaRequireLogin(['KS', 'Admin']);
  if (!user) throw new Error('Unauthorized');
  mountShell('supervisi');

  const editId = new URLSearchParams(window.location.search).get('id');
  let existing = null;
  const detailMap = {};

  if (editId) el('pageTitle').textContent = 'Edit Supervisi';

  renderInstrumen();

  (async function init() {
    await withLoading('Memuat data...', async () => {
      try {
        const guru = await sispaRequest('guru.list', {});
        const sel = el('fGuru');
        guru.forEach(g => {
          const opt = document.createElement('option');
          opt.value = g.id;
          opt.textContent = g.nama + (g.mapel ? ' — ' + g.mapel : '');
          sel.appendChild(opt);
        });

        if (editId) {
          const data = await sispaRequest('supervisi.get', { id: editId });
          existing = data.header;
          (data.detail || []).forEach(d => detailMap[d.kode_indikator] = d);
          populateForm();
        } else {
          el('fTanggal').value = todayIso();
        }
        updateTotal();
      } catch (err) { handleApiError(err); }
    });
  })();

  function renderInstrumen() {
    const container = el('instrumenContainer');
    let currentSection = '';
    let html = '';
    INSTRUMEN_LK1.forEach(ind => {
      if (ind.section !== currentSection) {
        if (currentSection) html += '</div>';
        html += `<div>
          <h3 class="font-semibold text-slate-800 text-sm mb-3 pb-2 border-b border-slate-200 flex items-center gap-2">
            <i data-lucide="chevron-right" class="w-4 h-4 text-indigo-500"></i>
            ${escapeHtml(ind.section)}
          </h3>`;
        currentSection = ind.section;
      }
      html += `
        <div class="border border-slate-200 rounded-lg p-4 mb-3 hover:border-slate-300 transition" data-kode="${ind.kode}">
          <div class="flex items-start gap-3 mb-3">
            <span class="text-mono text-xs font-semibold text-indigo-600 bg-indigo-50 px-2 py-1 rounded">${ind.kode}</span>
            <p class="text-sm text-slate-700 flex-1">${escapeHtml(ind.teks)}</p>
          </div>
          <div class="grid md:grid-cols-[180px_1fr] gap-3">
            <div>
              <label class="block text-xs text-slate-500 mb-1">Skor (1–4)</label>
              <div class="flex gap-1">
                ${[1,2,3,4].map(n => `
                  <button type="button" data-skor="${n}" data-target="${ind.kode}"
                          class="skor-btn">${n}</button>
                `).join('')}
              </div>
            </div>
            <div>
              <label class="block text-xs text-slate-500 mb-1">Catatan / Bukti</label>
              <textarea data-catatan="${ind.kode}" rows="1"
                        class="textarea text-sm"></textarea>
            </div>
          </div>
        </div>`;
    });
    html += '</div>';
    container.innerHTML = html;
    refreshIcons();

    container.querySelectorAll('.skor-btn').forEach(btn =>
      btn.addEventListener('click', () => setSkor(btn.dataset.target, parseInt(btn.dataset.skor, 10))));
  }

  function setSkor(kode, val) {
    const block = document.querySelector(`[data-kode="${kode}"]`);
    block.querySelectorAll('.skor-btn').forEach(b => {
      const v = parseInt(b.dataset.skor, 10);
      b.classList.toggle('active', v === val);
    });
    block.dataset.skor = val;
    updateTotal();
  }

  function getSkor(kode) {
    const block = document.querySelector(`[data-kode="${kode}"]`);
    return block && block.dataset.skor ? parseInt(block.dataset.skor, 10) : 0;
  }

  function updateTotal() {
    let total = 0, terisi = 0;
    INSTRUMEN_LK1.forEach(i => {
      const s = getSkor(i.kode);
      if (s > 0) { total += s; terisi++; }
    });
    el('totalSkor').textContent = total;
    const kat = el('kategori');
    if (terisi === 19) {
      kat.textContent = tentukanKategoriLK1(total);
      kat.className = 'badge ' + (
        total >= 66 ? 'badge-success' :
        total >= 51 ? 'badge-info' :
        total >= 26 ? 'badge-warning' : 'badge-danger'
      );
    } else {
      kat.textContent = `${terisi}/19`;
      kat.className = 'badge badge-neutral';
    }
  }

  function populateForm() {
    el('fGuru').value = existing.guru_id || '';
    el('fTanggal').value = (existing.tanggal || '').slice(0, 10);
    el('fMapel').value = existing.mapel || '';
    el('fMateri').value = existing.materi || '';
    el('fDurasi').value = existing.durasi || '';
    el('fLink').value = existing.link_dokumentasi || '';
    el('fCatatan').value = existing.catatan_tambahan || '';
    el('fKekuatan').value = existing.kekuatan || '';
    el('fArea').value = existing.area_pengembangan || '';
    el('fRencana').value = existing.rencana_pembinaan || '';

    INSTRUMEN_LK1.forEach(i => {
      const d = detailMap[i.kode];
      if (!d) return;
      if (d.skor > 0) setSkor(i.kode, d.skor);
      const ta = document.querySelector(`[data-catatan="${i.kode}"]`);
      if (ta) ta.value = d.catatan || '';
    });
  }

  async function save(submit) {
    const payload = {
      id: editId || '',
      guru_id: el('fGuru').value,
      tanggal: el('fTanggal').value,
      mapel: el('fMapel').value.trim(),
      materi: el('fMateri').value.trim(),
      durasi: parseInt(el('fDurasi').value || '0', 10),
      link_dokumentasi: el('fLink').value.trim(),
      catatan_tambahan: el('fCatatan').value,
      kekuatan: el('fKekuatan').value,
      area_pengembangan: el('fArea').value,
      rencana_pembinaan: el('fRencana').value,
      detail: INSTRUMEN_LK1.map(i => ({
        kode_indikator: i.kode,
        skor: getSkor(i.kode) || 0,
        catatan: (document.querySelector(`[data-catatan="${i.kode}"]`) || {}).value || ''
      }))
    };

    if (!payload.guru_id) return showToast('Pilih guru terlebih dahulu', 'error');
    if (!payload.tanggal) return showToast('Tanggal wajib diisi', 'error');

    const belum = payload.detail.filter(d => d.skor === 0).length;
    if (belum > 0 && !confirm(`Masih ada ${belum} indikator yang belum diberi skor. Lanjutkan?`)) return;

    const btnSave = el('btnSave'), btnSubmit = el('btnSubmit');
    btnSave.disabled = btnSubmit.disabled = true;
    showLoading(submit ? 'Mengirim...' : 'Menyimpan...');

    try {
      const res = await sispaRequest('supervisi.save', payload);
      if (submit) {
        await sispaRequest('supervisi.submit', { id: res.id });
        showToast('Supervisi terkirim ke Pengawas', 'success');
      } else {
        showToast(`Draft tersimpan (skor ${res.skor_total}, ${res.kategori})`, 'success');
      }
      setTimeout(() => window.location.href = sispaUrl('/ks/supervisi.html'), 900);
    } catch (err) {
      handleApiError(err);
      btnSave.disabled = btnSubmit.disabled = false;
      hideLoading();
    }
  }

  el('btnSave').addEventListener('click', () => save(false));
  el('btnSubmit').addEventListener('click', () => save(true));
</script>
</body>
</html>
