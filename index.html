<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SISPA — Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
  <div class="text-center mb-6">
    <h1 class="text-3xl font-bold text-indigo-700">SISPA</h1>
    <p class="text-sm text-slate-500 mt-1">Sistem Informasi Supervisi Pendidikan Akademik</p>
  </div>

  <form id="loginForm" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">NPSN Sekolah</label>
      <input type="text" id="npsn" required autocomplete="username"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
             placeholder="Contoh: 20512345" />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
      <input type="password" id="password" required autocomplete="current-password"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
             placeholder="Default: sama dengan NPSN" />
    </div>
    <div id="errorMsg" class="hidden text-sm text-red-600 bg-red-50 p-2 rounded"></div>
    <button type="submit" id="loginBtn"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition">
      Masuk
    </button>
  </form>

  <div class="mt-6 text-center">
    <a href="./settings.html" class="text-sm text-indigo-600 hover:underline">⚙️ Pengaturan Koneksi</a>
  </div>
  <p class="text-xs text-slate-400 text-center mt-4">Gunakan NPSN sebagai username dan password awal.</p>
</div>

<script src="./assets/js/config.js"></script>
<script src="./assets/js/api.js"></script>
<script src="./assets/js/auth.js"></script>
<script>
  if (sispaIsLoggedIn()) sispaRedirectByRole(sispaGetUser());

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errBox = document.getElementById('errorMsg');
    errBox.classList.add('hidden');
    const npsn = document.getElementById('npsn').value.trim();
    const password = document.getElementById('password').value;
    btn.disabled = true; btn.textContent = 'Memproses...';
    try {
      const data = await sispaLogin(npsn, password);
      sispaRedirectByRole(data.user);
    } catch (err) {
      errBox.textContent = err.message || 'Login gagal';
      errBox.classList.remove('hidden');
    } finally {
      btn.disabled = false; btn.textContent = 'Masuk';
    }
  });
</script>
</body>
</html>
