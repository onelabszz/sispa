<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SISPA — Dashboard Pengawas</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>

<div class="mb-6">
  <h1 class="text-2xl font-bold text-slate-900">Dashboard Pengawas</h1>
  <p class="text-sm text-slate-500 mt-1">Monitoring supervisi di sekolah binaan.</p>
</div>

<div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
  <div class="stat-card">
    <div class="stat-icon bg-blue-50 text-blue-600"><i data-lucide="building-2" class="w-5 h-5"></i></div>
    <div>
      <div class="text-xs text-slate-500">Sekolah</div>
      <div id="statSekolah" class="text-2xl font-bold text-slate-900">—</div>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon bg-indigo-50 text-indigo-600"><i data-lucide="clipboard-list" class="w-5 h-5"></i></div>
    <div>
      <div class="text-xs text-slate-500">Total Supervisi</div>
      <div id="statTotal" class="text-2xl font-bold text-slate-900">—</div>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon bg-emerald-50 text-emerald-600"><i data-lucide="check-circle-2" class="w-5 h-5"></i></div>
    <div>
      <div class="text-xs text-slate-500">Terkirim</div>
      <div id="statTerkirim" class="text-2xl font-bold text-slate-900">—</div>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon bg-purple-50 text-purple-600"><i data-lucide="trending-up" class="w-5 h-5"></i></div>
    <div>
      <div class="text-xs text-slate-500">Rata Skor</div>
      <div id="statSkor" class="text-2xl font-bold text-slate-900">—</div>
    </div>
  </div>
</div>

<div class="card overflow-hidden">
  <div class="card-header">
    <div class="flex items-center gap-2">
      <i data-lucide="building-2" class="w-4 h-4 text-slate-500"></i>
      <h2 class="font-semibold text-slate-900 text-sm">Rekap per Sekolah</h2>
    </div>
  </div>
  <div class="overflow-x-auto">
    <table class="table">
      <thead>
        <tr>
          <th>NPSN</th>
          <th>Sekolah</th>
          <th class="text-center">Total</th>
          <th class="text-center">Terkirim</th>
          <th class="text-center">Rata Skor</th>
          <th class="text-right">Aksi</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div id="emptyState" class="hidden empty-state">
    <div class="empty-state-icon"><i data-lucide="building-2" class="w-6 h-6"></i></div>
    <h3 class="font-semibold text-slate-900 mb-1">Belum ada data</h3>
    <p class="text-sm text-slate-500">Sekolah binaan belum mengirim supervisi.</p>
  </div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  const user = sispaRequireLogin(['Pengawas', 'Admin']);
  if (user) { mountShell('dashboard'); load(); }

  async function load() {
    await withLoading('Memuat data...', async () => {
      try {
        const data = await sispaRequest('dashboard.pengawas', {});
        el('statSekolah').textContent = data.jumlah_sekolah;
        el('statTotal').textContent = data.total_supervisi;
        el('statTerkirim').textContent = data.total_terkirim;
        const avg = data.sekolah.length
          ? Math.round(data.sekolah.reduce((a, s) => a + (s.rata_skor || 0), 0) / data.sekolah.length)
          : 0;
        el('statSkor').textContent = avg;

        const tbody = el('tableBody');
        const empty = el('emptyState');
        const table = tbody.closest('.card').querySelector('.overflow-x-auto');

        if (!data.sekolah.length) {
          table.classList.add('hidden');
          empty.classList.remove('hidden');
          refreshIcons();
          return;
        }
        table.classList.remove('hidden');
        empty.classList.add('hidden');

        tbody.innerHTML = data.sekolah.map(s => `
          <tr>
            <td class="text-mono text-xs">${escapeHtml(s.npsn)}</td>
            <td class="font-medium text-slate-900">${escapeHtml(s.nama_sekolah)}</td>
            <td class="text-center">${s.total_supervisi}</td>
            <td class="text-center">${s.supervisi_terkirim}</td>
            <td class="text-center text-mono font-medium">${s.rata_skor}</td>
            <td class="text-right">
              <a href="./sekolah.html?npsn=${encodeURIComponent(s.npsn)}" class="btn btn-ghost text-xs">
                <span>Detail</span>
                <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
              </a>
            </td>
          </tr>`).join('');
        refreshIcons();
      } catch (err) { handleApiError(err); }
    });
  }
</script>
</body>
</html>
