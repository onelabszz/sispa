<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SISPA — Detail Sekolah</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>

<div class="flex items-center justify-between mb-6 gap-4">
  <div>
    <h1 id="schoolName" class="text-2xl font-bold text-slate-900">Detail Sekolah</h1>
    <p id="schoolNpsn" class="text-sm text-slate-500 mt-1">—</p>
  </div>
  <a href="./dashboard.html" class="btn btn-ghost">
    <i data-lucide="arrow-left" class="w-4 h-4"></i>
    <span>Kembali</span>
  </a>
</div>

<div class="card overflow-hidden">
  <div class="card-header">
    <div class="flex items-center gap-2">
      <i data-lucide="users" class="w-4 h-4 text-slate-500"></i>
      <h2 class="font-semibold text-slate-900 text-sm">Rekap per Guru</h2>
    </div>
  </div>
  <div class="overflow-x-auto">
    <table class="table">
      <thead>
        <tr>
          <th>Guru</th>
          <th>Mapel</th>
          <th class="text-center">Supervisi</th>
          <th class="text-center">Terkirim</th>
          <th class="text-center">Rata Skor</th>
          <th>Terakhir</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div id="emptyState" class="hidden empty-state">
    <div class="empty-state-icon"><i data-lucide="users" class="w-6 h-6"></i></div>
    <h3 class="font-semibold text-slate-900 mb-1">Belum ada data guru</h3>
    <p class="text-sm text-slate-500">Sekolah ini belum memiliki data guru.</p>
  </div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  const user = sispaRequireLogin(['Pengawas', 'Admin']);
  if (!user) throw new Error('Unauthorized');
  mountShell('dashboard');

  const npsn = new URLSearchParams(window.location.search).get('npsn');
  if (!npsn) {
    alert('NPSN tidak ditemukan di URL.');
    window.location.href = sispaUrl('/pengawas/dashboard.html');
  }

  (async function load() {
    await withLoading('Memuat data sekolah...', async () => {
      try {
        const data = await sispaRequest('dashboard.sekolah', { npsn_sekolah: npsn });
        el('schoolName').textContent = data.nama_sekolah || npsn;
        el('schoolNpsn').textContent = 'NPSN ' + data.npsn_sekolah;

        const tbody = el('tableBody');
        const empty = el('emptyState');
        const table = tbody.closest('.card').querySelector('.overflow-x-auto');

        if (!data.guru.length) {
          table.classList.add('hidden');
          empty.classList.remove('hidden');
          refreshIcons();
          return;
        }

        tbody.innerHTML = data.guru.map(r => `
          <tr>
            <td class="font-medium text-slate-900">${escapeHtml(r.guru.nama)}</td>
            <td>${escapeHtml(r.guru.mapel || '—')}</td>
            <td class="text-center">${r.jumlah_supervisi}</td>
            <td class="text-center">${r.supervisi_terkirim}</td>
            <td class="text-center text-mono font-medium">${r.rata_skor}</td>
            <td class="text-xs text-slate-500">${formatTanggal(r.terakhir)}</td>
          </tr>`).join('');
        refreshIcons();
      } catch (err) { handleApiError(err); }
    });
  })();
</script>
</body>
</html>
