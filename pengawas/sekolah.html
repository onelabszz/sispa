<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SISPA — Detail Sekolah</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body class="bg-slate-100 min-h-screen">
<div id="appHeader"></div>

<main class="max-w-6xl mx-auto px-4 py-8">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 id="schoolName" class="text-2xl font-bold text-slate-800">Detail Sekolah</h1>
      <p id="schoolNpsn" class="text-sm text-slate-500"></p>
    </div>
    <a href="./dashboard.html" class="text-sm text-indigo-600 hover:underline">← Kembali</a>
  </div>

  <div class="bg-white rounded-xl shadow-sm overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 text-slate-600 text-left">
        <tr>
          <th class="px-4 py-3">Guru</th>
          <th class="px-4 py-3">Mapel</th>
          <th class="px-4 py-3 text-center">Supervisi</th>
          <th class="px-4 py-3 text-center">Terkirim</th>
          <th class="px-4 py-3 text-center">Rata Skor</th>
          <th class="px-4 py-3">Terakhir</th>
        </tr>
      </thead>
      <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
    </table>
    <div id="emptyState" class="hidden p-8 text-center text-slate-500">Belum ada data guru.</div>
  </div>
</main>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  const user = sispaRequireLogin(['Pengawas']);
  if (!user) throw new Error('Unauthorized');
  mountHeader('/pengawas/dashboard.html');

  const npsn = new URLSearchParams(window.location.search).get('npsn');
  if (!npsn) {
    alert('NPSN tidak ditemukan di URL.');
    window.location.href = sispaUrl('/pengawas/dashboard.html');
  }

  (async function load() {
    try {
      const data = await sispaRequest('dashboard.sekolah', { npsn_sekolah: npsn });
      el('schoolName').textContent = data.nama_sekolah || npsn;
      el('schoolNpsn').textContent = 'NPSN ' + data.npsn_sekolah;
      const tbody = el('tableBody');
      if (!data.guru.length) {
        el('emptyState').classList.remove('hidden');
        return;
      }
      tbody.innerHTML = data.guru.map(r => `
        <tr class="hover:bg-slate-50">
          <td class="px-4 py-3 font-medium">${escapeHtml(r.guru.nama)}</td>
          <td class="px-4 py-3">${escapeHtml(r.guru.mapel)}</td>
          <td class="px-4 py-3 text-center">${r.jumlah_supervisi}</td>
          <td class="px-4 py-3 text-center">${r.supervisi_terkirim}</td>
          <td class="px-4 py-3 text-center font-mono">${r.rata_skor}</td>
          <td class="px-4 py-3 text-xs">${formatTanggal(r.terakhir)}</td>
        </tr>`).join('');
    } catch (err) { handleApiError(err); }
  })();
</script>
</body>
</html>
